      <stop offset="1" stop-color="#7b337e" stop-opacity="0"/>
    </radialGradient>
    <filter id="wsoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="wblur2" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="15"/></filter>
  </defs>

  <g transform="translate(15,15) scale(0.3516)">
