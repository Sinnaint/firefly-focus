    <rect x="24" y="24" width="464" height="464" rx="116" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
    <circle cx="256" cy="150" r="132" fill="url(#whalo)" opacity="0.34" filter="url(#wblur2)"/>
    <path d="M310.9 134.2 A130 130 0 1 1 201.1 134.2" fill="none" stroke="url(#wring)" stroke-width="26" stroke-linecap="round" opacity="0.55" filter="url(#wsoft)"/>
    <path d="M310.9 134.2 A130 130 0 1 1 201.1 134.2" fill="none" stroke="url(#wring)" stroke-width="26" stroke-linecap="round"/>
    <circle cx="234" cy="150" r="6" fill="#f5d5e0" opacity="0.5"/>
