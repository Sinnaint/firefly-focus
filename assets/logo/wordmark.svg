<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 210" width="780" height="210" role="img" aria-label="Firefly Focus — Pomodoro Timer &amp; Tasks" font-family="ui-sans-serif, system-ui, 'Segoe UI', Inter, sans-serif">
  <title>Firefly Focus</title>
  <defs>
    <radialGradient id="wbg" cx="50%" cy="32%" r="78%">
      <stop offset="0" stop-color="#3a0b45"/>
      <stop offset="0.55" stop-color="#210635"/>
      <stop offset="1" stop-color="#120220"/>
    </radialGradient>
    <linearGradient id="wring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5d5e0"/>
      <stop offset="0.55" stop-color="#e39ad6"/>
      <stop offset="1" stop-color="#c965cb"/>
    </linearGradient>
    <radialGradient id="wcore" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#fffcfe"/>
      <stop offset="0.45" stop-color="#fbe6f1"/>
