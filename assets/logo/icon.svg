<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Firefly Focus">
  <title>Firefly Focus</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="78%">
      <stop offset="0" stop-color="#3a0b45"/>
      <stop offset="0.55" stop-color="#210635"/>
      <stop offset="1" stop-color="#120220"/>
    </radialGradient>
    <!-- Kept bright end-to-end: at 16px a ring that fades into the ground disappears. -->
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5d5e0"/>
      <stop offset="0.55" stop-color="#e39ad6"/>
      <stop offset="1" stop-color="#c965cb"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#fffcfe"/>
      <stop offset="0.45" stop-color="#fbe6f1"/>
      <stop offset="1" stop-color="#f5d5e0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f5d5e0" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#c965cb" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7b337e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="blur2" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="15"/></filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="116" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
  <circle cx="256" cy="150" r="132" fill="url(#halo)" opacity="0.34" filter="url(#blur2)"/>
  <path d="M310.9 134.2 A130 130 0 1 1 201.1 134.2" fill="none" stroke="url(#ring)" stroke-width="26" stroke-linecap="round" opacity="0.55" filter="url(#soft)"/>
  <path d="M310.9 134.2 A130 130 0 1 1 201.1 134.2" fill="none" stroke="url(#ring)" stroke-width="26" stroke-linecap="round"/>
  <circle cx="234" cy="150" r="6" fill="#f5d5e0" opacity="0.5"/>
  <circle cx="220" cy="176" r="4.5" fill="#c965cb" opacity="0.34"/>
  <circle cx="211" cy="200" r="3.2" fill="#8e90d4" opacity="0.24"/>
  <circle cx="256" cy="120" r="52" fill="url(#halo)"/>
  <g fill="#fffcfe" fill-opacity="0.16">
    <ellipse cx="238" cy="116" rx="20" ry="12" transform="rotate(-24 238 116)"/>
    <ellipse cx="274" cy="116" rx="20" ry="12" transform="rotate(24 274 116)"/>
  </g>
  <circle cx="256" cy="120" r="15" fill="url(#core)"/>
  <circle cx="256" cy="120" r="15" fill="none" stroke="#fffcfe" stroke-opacity="0.6" stroke-width="1.5"/>
</svg>
