<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280" font-family="Arial, 'Segoe UI', sans-serif">
  <defs>
    <radialGradient id="s-bg" cx="30%" cy="20%" r="95%">
      <stop offset="0" stop-color="#1b2a45"/>
      <stop offset="55%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#070c18"/>
    </radialGradient>
    <linearGradient id="s-ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="0.55" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="s-core" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="0.45" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </radialGradient>
    <radialGradient id="s-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="s-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="s-blur" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect x="0" y="0" width="440" height="280" fill="url(#s-bg)"/>
  <circle cx="120" cy="80" r="150" fill="url(#s-halo)" opacity="0.16"/>

  <!-- ambient fireflies -->
  <g>
    <circle cx="300" cy="60" r="3" fill="#fcd34d" opacity="0.85" filter="url(#s-blur)"/>
    <circle cx="360" cy="150" r="2.4" fill="#fbbf24" opacity="0.7" filter="url(#s-blur)"/>
    <circle cx="250" cy="220" r="2.6" fill="#fcd34d" opacity="0.6" filter="url(#s-blur)"/>
    <circle cx="405" cy="95" r="2" fill="#f59e0b" opacity="0.55" filter="url(#s-blur)"/>
    <circle cx="185" cy="245" r="2" fill="#fbbf24" opacity="0.5" filter="url(#s-blur)"/>
  </g>

  <!-- App icon (ring + firefly) -->
  <g transform="translate(30,70) scale(0.273)">
    <circle cx="256" cy="150" r="132" fill="url(#s-halo)" opacity="0.34" filter="url(#s-soft)"/>
    <path d="M310.9 134.2 A130 130 0 1 1 201.1 134.2" fill="none" stroke="url(#s-ring)" stroke-width="26" stroke-linecap="round" opacity="0.55" filter="url(#s-soft)"/>
    <path d="M310.9 134.2 A130 130 0 1 1 201.1 134.2" fill="none" stroke="url(#s-ring)" stroke-width="26" stroke-linecap="round"/>
    <circle cx="256" cy="120" r="52" fill="url(#s-halo)"/>
    <circle cx="256" cy="120" r="15" fill="url(#s-core)"/>
    <circle cx="256" cy="120" r="15" fill="none" stroke="#fffdf6" stroke-opacity="0.6" stroke-width="1.5"/>
  </g>

  <!-- Wordmark -->
  <text x="196" y="128" font-size="44" font-weight="800" letter-spacing="-1" fill="#fbbf24">Firefly</text>
  <text x="196" y="176" font-size="44" font-weight="800" letter-spacing="-1" fill="#eef3fb">Focus</text>
  <text x="198" y="210" font-size="15" font-weight="700" letter-spacing="0.3" fill="#93a4c1">Pomodoro &#183; tasks &#183; fireflies</text>
</svg>
