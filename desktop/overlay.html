<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'">
  <title>Firefly Focus</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    /* The same floor the widget gives a wandering cat on a website. */
    .floor {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .floor .buddy {
      --buddy-size: 112px;
      position: absolute;
      inset: 0;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="floor"><div id="cat"></div></div>
  <script src="../buddy.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
