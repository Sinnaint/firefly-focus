<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firefly Focus</title>
  <!-- sidepanel.css is the single source of theme tokens, ring and firefly
       styles; fullscreen.css only re-lays them out for a whole screen. -->
  <link rel="stylesheet" href="sidepanel.css" />
  <link rel="stylesheet" href="fullscreen.css" />
</head>
<body data-mode="work" data-theme="midnight" class="fs-body">
  <div id="fireflyLayer" class="firefly-layer" aria-hidden="true"></div>

  <main class="fs">
    <div id="ring" class="ring fs-ring">
      <div class="ring-inner fs-ring-inner">
        <div id="timer" class="timer fs-timer">25:00</div>
        <div id="mode" class="mode fs-mode">Робота</div>
      </div>
    </div>

    <p id="task" class="fs-task"></p>

    <div class="fs-controls">
      <button id="startBtn" class="primary" type="button">Старт</button>
      <button id="pauseBtn" type="button">Пауза</button>
      <button id="nextBtn" type="button">Наступний етап</button>
    </div>

    <div class="fs-meta">
      <span><strong id="sessions">0/8</strong> <span id="sessionsLabel">сесій сьогодні</span></span>
      <span class="fs-dot" aria-hidden="true">·</span>
      <span><strong id="focus">0 хв</strong> <span id="focusLabel">фокусу сьогодні</span></span>
    </div>
  </main>

  <div id="studyBuddy" class="buddy fs-buddy" hidden></div>

  <div class="fs-corner">
    <!-- Day/night, the cat on or off, and the purr — the panel's dock. -->
    <button id="dayNightBtn" class="daynight fs-daynight" type="button" role="switch" aria-checked="true">
      <svg class="dn-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4 7 7M17 17l1.6 1.6M5.4 18.6 7 17M17 7l1.6-1.6"/>
      </svg>
      <svg class="dn-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 14.6A8.2 8.2 0 0 1 9.4 4a8.2 8.2 0 1 0 10.6 10.6z"/>
      </svg>
    </button>
    <button id="buddyToggleBtn" class="fs-icon" type="button" aria-pressed="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4.9 11.2 4.4 4.4l4.4 3a8.2 8.2 0 0 1 6.4 0l4.4-3-.5 6.8A7.4 7.4 0 0 1 12 19.4a7.4 7.4 0 0 1-7.1-8.2z"/>
        <path d="M9.3 12.3h.01M14.7 12.3h.01" stroke-width="2.8"/>
        <path d="M10.3 15.4l.85.7.85-.7.85.7.85-.7"/>
      </svg>
    </button>
    <button id="purrBtn" class="fs-icon" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 17.2s-4.6-2.9-4.6-6.2A2.5 2.5 0 0 1 12 9.7a2.5 2.5 0 0 1 4.6 1.3c0 3.3-4.6 6.2-4.6 6.2z"/>
        <g class="purr-waves"><path d="M4.4 9.3a5.2 5.2 0 0 0 0 5.6M2.3 7.7a8.4 8.4 0 0 0 0 8.8M19.6 9.3a5.2 5.2 0 0 1 0 5.6M21.7 7.7a8.4 8.4 0 0 1 0 8.8"/></g>
      </svg>
    </button>
    <span class="fs-corner-gap" aria-hidden="true"></span>
    <button id="settingsBtn" class="fs-icon" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M12 2.6v2.6M12 18.8v2.6M21.4 12h-2.6M5.2 12H2.6M18.6 5.4l-1.8 1.8M7.2 16.8l-1.8 1.8M18.6 18.6l-1.8-1.8M7.2 7.2L5.4 5.4"/>
      </svg>
    </button>
    <button id="fsBtn" class="fs-icon" type="button" aria-label="Fullscreen">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path class="fs-in" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
        <path class="fs-out" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>
      </svg>
    </button>
    <button id="closeBtn" class="fs-icon" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
  </div>

  <!-- Draggable task card. Position is remembered in chrome.storage.local. -->
  <aside id="taskCard" class="fs-tasks" hidden>
    <div id="taskCardDrag" class="fs-tasks-head">
      <span id="taskCardTitle" class="fs-tasks-title">Задачі</span>
      <span id="taskCardDragLabel" class="fs-tasks-drag">Перетягни</span>
    </div>
    <form id="taskCardForm" class="fs-tasks-form">
      <input id="taskCardInput" type="text" maxlength="90" placeholder="Додай одну фокус-задачу..." />
      <button type="submit" aria-label="Add task">+</button>
    </form>
    <ul id="taskCardList" class="tasks fs-tasks-list"></ul>
  </aside>

  <!-- The form inside is cloned from sidepanel.html at runtime, so there is
       exactly one copy of the settings markup in the project. -->
  <div id="settingsOverlay" class="fs-overlay" hidden>
    <div id="settingsSheet" class="fs-sheet" role="dialog" aria-modal="true">
      <!-- Own row, not floated over the content: an absolute close button
           landed on top of the theme select and forced the section headings
           to reserve space for it, knocking their buttons out of alignment. -->
      <div class="fs-sheet-bar">
        <button id="settingsClose" class="fs-icon" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </button>
      </div>
      <div id="settingsMount"></div>
      <button id="openPanelBtn" class="fs-panel-link" type="button">Відкрити повну панель</button>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="buddy.js"></script>
  <script src="fullscreen.js"></script>
</body>
</html>
