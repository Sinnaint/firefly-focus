<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firefly Focus</title>
  <!-- sidepanel.css is the single source of theme tokens, ring and firefly
       styles; fullscreen.css only re-lays them out for a whole screen. -->
  <link rel="stylesheet" href="sidepanel.css" />
  <link rel="stylesheet" href="fullscreen.css" />
</head>
<body data-mode="work" data-theme="midnight" class="fs-body">
  <div id="fireflyLayer" class="firefly-layer" aria-hidden="true"></div>

  <main class="fs">
    <div id="ring" class="ring fs-ring">
      <div class="ring-inner fs-ring-inner">
        <div id="timer" class="timer fs-timer">25:00</div>
        <div id="mode" class="mode fs-mode">Робота</div>
      </div>
    </div>

    <p id="task" class="fs-task"></p>

    <div class="fs-controls">
      <button id="startBtn" class="primary" type="button">Старт</button>
      <button id="pauseBtn" type="button">Пауза</button>
      <button id="nextBtn" type="button">Наступний етап</button>
    </div>

    <div class="fs-meta">
      <span><strong id="sessions">0/8</strong> <span id="sessionsLabel">сесій сьогодні</span></span>
      <span class="fs-dot" aria-hidden="true">·</span>
      <span><strong id="focus">0 хв</strong> <span id="focusLabel">фокусу сьогодні</span></span>
    </div>
  </main>

  <div class="fs-corner">
    <button id="fsBtn" class="fs-icon" type="button" aria-label="Fullscreen">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path class="fs-in" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
        <path class="fs-out" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>
      </svg>
    </button>
    <button id="closeBtn" class="fs-icon" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
  </div>

  <script src="shared.js"></script>
  <script src="fullscreen.js"></script>
</body>
</html>
