<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Buddy sprite sheet</title>
<style>
  body { margin: 0; padding: 16px; background: #1c1222; color: #e8dcef; font: 12px system-ui, sans-serif; }
  h2 { margin: 18px 0 6px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: #bba7c8; }
  canvas { image-rendering: pixelated; display: block; }
</style>
</head>
<body>
<h2>Every frame, zoomed — midnight · daylight · sage backgrounds</h2>
<canvas id="sheet"></canvas>
<script src="../../buddy.js"></script>
<script>
/*
 * Sprite sheet for the study buddy. buddy.js rasterises the art from shapes
 * at load; this page lays every part of every pose out zoomed, on the three
 * theme backgrounds, so a change can be judged before opening the panel.
 *
 * window.save(name) posts the sheet to a local server that accepts
 * POST /__save?path=… (handy for diffing); otherwise right-click → save.
 */
const B = FireflyBuddy;
const BACKS = ["#2a0b36", "#f4e7fb", "#122019"];

const rows = [
  ["walk", ["stand", 0, 1, 2, 3, 4, 5, 6, 7].map((frame) => ({ frame }))],
  ["sit", [{ eyes: "open" }, { eyes: "look" }, { eyes: "half" }, { eyes: "shut" }, { eyes: "happy" }, { lit: false, day: true }]],
  ["lie", [{}, { lit: false, day: true }]],
];

const Z = 4;
const cellW = B.FRAME.w * Z + 8;
const cellH = B.FRAME.h * Z + 8;
const sheet = document.getElementById("sheet");
sheet.width = 9 * cellW;
sheet.height = rows.length * BACKS.length * cellH;
const ctx = sheet.getContext("2d");
ctx.imageSmoothingEnabled = false;

let y = 0;
for (const back of BACKS) {
  for (const [pose, variants] of rows) {
    variants.forEach((opts, i) => {
      const day = back === BACKS[1];
      const g = B.compose(pose, { lit: !day, day, ...opts });
      ctx.fillStyle = back;
      ctx.fillRect(i * cellW, y, cellW - 4, cellH - 4);
      ctx.drawImage(B.gridToCanvas(g), i * cellW + 4, y + 4, B.FRAME.w * Z, B.FRAME.h * Z);
    });
    y += cellH;
  }
}

window.save = async (name = "sheet.png") => {
  const blob = await new Promise((r) => sheet.toBlob(r, "image/png"));
  const resp = await fetch("/__save?path=" + encodeURIComponent("_preview/" + name), { method: "POST", body: blob });
  return resp.ok;
};

/* A closer look at a single head, for the face. */
window.saveHead = async (eyes = "open", name = "head.png") => {
  const g = B.buildGrids().heads[eyes];
  const c = document.createElement("canvas");
  const z = 16;
  c.width = g.w * z; c.height = g.h * z;
  const x = c.getContext("2d");
  x.imageSmoothingEnabled = false;
  x.fillStyle = "#2a0b36"; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(B.gridToCanvas(g), 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, "image/png"));
  const resp = await fetch("/__save?path=" + encodeURIComponent("_preview/" + name), { method: "POST", body: blob });
  return resp.ok;
};
</script>
</body>
</html>
